services:
  postgres:
    image: postgres:17-alpine
    container_name: lonavala_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-lonavala_mc_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-lonavala_mc_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Adminer UI for database inspection at http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: lonavala_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
